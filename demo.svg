<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ee787"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect width="720" height="380" rx="8" fill="#0d1117"/>

  <!-- ============ Frame 1: Architecture ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" dur="16s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;0.99;1"/>
    <text x="20" y="28" fill="#58a6ff" font-weight="bold" font-size="14">lsmcp &#8212; ARCHITECTURE</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">MCP server that turns Logseq pages &amp; blocks into agent-callable tools</text>

    <rect x="24" y="120" width="144" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="96" y="158" fill="#58a6ff" font-weight="bold" font-size="13" text-anchor="middle">MCP CLIENT</text>
    <text x="96" y="178" fill="#8b949e" font-size="10" text-anchor="middle">Claude &#183; Cursor</text>
    <text x="96" y="194" fill="#484f58" font-size="9" text-anchor="middle">VS Code MCP</text>

    <rect x="200" y="120" width="144" height="90" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="272" y="158" fill="#7ee787" font-weight="bold" font-size="13" text-anchor="middle">lsmcp</text>
    <text x="272" y="178" fill="#8b949e" font-size="10" text-anchor="middle">Python MCP server</text>
    <text x="272" y="194" fill="#484f58" font-size="9" text-anchor="middle">stdio &#183; HTTP</text>

    <rect x="376" y="120" width="144" height="90" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="448" y="158" fill="#a371f7" font-weight="bold" font-size="13" text-anchor="middle">LOGSEQ API</text>
    <text x="448" y="178" fill="#8b949e" font-size="10" text-anchor="middle">127.0.0.1:12315</text>
    <text x="448" y="194" fill="#484f58" font-size="9" text-anchor="middle">Bearer token</text>

    <rect x="552" y="120" width="144" height="90" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="624" y="155" fill="#d29922" font-weight="bold" font-size="13" text-anchor="middle">GRAPH</text>
    <circle cx="624" cy="172" r="9" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <path d="M614 169 h20 M614 175 h12" stroke="#d29922" stroke-width="1.5" stroke-linecap="round"/>
    <text x="624" y="196" fill="#484f58" font-size="9" text-anchor="middle">pages &#183; blocks</text>

    <line x1="168" y1="165" x2="198" y2="165" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB)"/>
    <line x1="344" y1="165" x2="374" y2="165" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <line x1="520" y1="165" x2="550" y2="165" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrowP)"/>

    <circle r="3" fill="#58a6ff"><animate attributeName="cx" values="168;198" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="165" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#7ee787"><animate attributeName="cx" values="344;374" dur="1.6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cy" values="165" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#a371f7"><animate attributeName="cx" values="520;550" dur="1.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="165" dur="1.6s" repeatCount="indefinite"/></circle>

    <text x="360" y="330" fill="#484f58" font-size="10" text-anchor="middle">MCP client &#8594; lsmcp tools &#8594; Logseq HTTP API &#8594; your graph</text>
    <text x="360" y="352" fill="#484f58" font-size="10" text-anchor="middle">no plugin &#183; no renderer sandbox &#183; runs as a normal process</text>
  </g>

  <!-- ============ Frame 2: Read flow ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;0.99;1"/>
    <text x="20" y="28" fill="#58a6ff" font-weight="bold" font-size="14">READ &#8212; EXPLORE THE GRAPH</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">lean JSON responses, blocks deduplicated by UUID at read time</text>

    <rect x="24" y="80" width="672" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="98" fill="#58a6ff" font-size="11">request</text>
    <text x="120" y="98" fill="#8b949e" font-size="11">get_page &#183; search_pages &#183; page_outline &#183; graph_stats &#183; query &#183; search_blocks</text>

    <rect x="24" y="120" width="672" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="138" fill="#7ee787" font-size="11">lsmcp</text>
    <text x="120" y="138" fill="#8b949e" font-size="11">backlinks &#183; namespaces &#183; datalog &#183; blueprints &#183; conventions &#183; orphans</text>

    <rect x="24" y="160" width="672" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="178" fill="#a371f7" font-size="11">logseq</text>
    <text x="120" y="178" fill="#8b949e" font-size="11">logseq.Editor.* &#183; logseq.DB.customQuery over the local HTTP API</text>

    <rect x="24" y="200" width="672" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="218" fill="#d29922" font-size="11">result</text>
    <text x="120" y="218" fill="#8b949e" font-size="11">pages + block trees, JSON, greedy-loaded only when asked</text>

    <line x1="360" y1="240" x2="360" y2="266" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB)"/>
    <text x="372" y="258" fill="#8b949e" font-size="10">progressive disclosure</text>

    <rect x="24" y="274" width="672" height="60" rx="4" fill="#0b1a12" stroke="#7ee787" stroke-width="1"/>
    <text x="40" y="296" fill="#7ee787" font-size="11">tip</text>
    <text x="90" y="296" fill="#8b949e" font-size="11">start with graph_stats for orientation, then search_pages to locate,</text>
    <text x="90" y="316" fill="#8b949e" font-size="11">then page_outline / get_block to drill in. Never load the whole graph.</text>
  </g>

  <!-- ============ Frame 3: Write flow ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;0.99;1"/>
    <text x="20" y="28" fill="#58a6ff" font-weight="bold" font-size="14">WRITE &#8212; SAFE MUTATIONS</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">every write is verified by reading the graph back after the call</text>

    <rect x="24" y="80" width="330" height="120" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="40" y="104" fill="#7ee787" font-weight="bold" font-size="12">mutate</text>
    <text x="40" y="128" fill="#c9d1d9" font-size="11">page_create</text>
    <text x="40" y="146" fill="#c9d1d9" font-size="11">block_append / prepend / update / delete</text>
    <text x="40" y="164" fill="#c9d1d9" font-size="11">rename_page &#183; move_block &#183; delete_page</text>
    <text x="40" y="182" fill="#c9d1d9" font-size="11">journal_today / append / range</text>

    <rect x="366" y="80" width="330" height="120" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="382" y="104" fill="#d29922" font-weight="bold" font-size="12">verify</text>
    <text x="382" y="128" fill="#c9d1d9" font-size="11">read target page tree back</text>
    <text x="382" y="146" fill="#c9d1d9" font-size="11">confirm block uuid present / absent</text>
    <text x="382" y="164" fill="#c9d1d9" font-size="11">confirm move position &amp; subtree intact</text>
    <text x="382" y="182" fill="#c9d1d9" font-size="11">raise on silent failure</text>

    <line x1="354" y1="140" x2="364" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB)"/>

    <rect x="24" y="214" width="672" height="60" rx="4" fill="#1a1205" stroke="#d29922" stroke-width="1"/>
    <text x="40" y="236" fill="#d29922" font-size="11">auth</text>
    <text x="90" y="236" fill="#8b949e" font-size="11">requires the Logseq API server enabled + LOGSEQ_API_TOKEN</text>
    <text x="90" y="256" fill="#8b949e" font-size="11">bind to 127.0.0.1 by default &#8212; do not expose without a proxy</text>

    <text x="360" y="330" fill="#484f58" font-size="10" text-anchor="middle">destructive tools (delete) are irreversible &#8212; verify the uuid first</text>
  </g>

  <!-- ============ Frame 4: Toolbox ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;0.99;1"/>
    <text x="20" y="28" fill="#58a6ff" font-weight="bold" font-size="14">34 TOOLS &#8212; ONE SERVER</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">curated for agent workflows, not raw CRUD</text>

    <rect x="24" y="76" width="212" height="150" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="130" y="118" fill="#58a6ff" font-size="34" text-anchor="middle" font-weight="bold">8</text>
    <text x="130" y="140" fill="#58a6ff" font-size="12" text-anchor="middle">CORE</text>
    <text x="130" y="166" fill="#8b949e" font-size="10" text-anchor="middle">read / navigate</text>
    <text x="130" y="184" fill="#484f58" font-size="9" text-anchor="middle">get_page &#183; list_pages</text>
    <text x="130" y="198" fill="#484f58" font-size="9" text-anchor="middle">search &#183; backlinks</text>
    <text x="130" y="212" fill="#484f58" font-size="9" text-anchor="middle">namespaces</text>

    <rect x="254" y="76" width="212" height="150" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="360" y="118" fill="#7ee787" font-size="34" text-anchor="middle" font-weight="bold">15</text>
    <text x="360" y="140" fill="#7ee787" font-size="12" text-anchor="middle">NAV / GRAPH</text>
    <text x="360" y="166" fill="#8b949e" font-size="10" text-anchor="middle">analysis</text>
    <text x="360" y="184" fill="#484f58" font-size="9" text-anchor="middle">query &#183; graph_stats</text>
    <text x="360" y="198" fill="#484f58" font-size="9" text-anchor="middle">blueprints &#183; conventions</text>
    <text x="360" y="212" fill="#484f58" font-size="9" text-anchor="middle">validate &#183; orphans</text>

    <rect x="484" y="76" width="212" height="150" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="590" y="118" fill="#a371f7" font-size="34" text-anchor="middle" font-weight="bold">11</text>
    <text x="590" y="140" fill="#a371f7" font-size="12" text-anchor="middle">WRITE</text>
    <text x="590" y="166" fill="#8b949e" font-size="10" text-anchor="middle">mutate + verify</text>
    <text x="590" y="184" fill="#484f58" font-size="9" text-anchor="middle">page_create</text>
    <text x="590" y="198" fill="#484f58" font-size="9" text-anchor="middle">block_* &#183; move_block</text>
    <text x="590" y="212" fill="#484f58" font-size="9" text-anchor="middle">journals</text>

    <text x="360" y="270" fill="#c9d1d9" font-size="11" text-anchor="middle">list_namespace_tree &#183; expand_references &#183; forward_links &#183; cross_reference</text>
    <text x="360" y="290" fill="#c9d1d9" font-size="11" text-anchor="middle">namespace_stats &#183; similar_pages &#183; page_outline &#183; get_blueprint</text>

    <rect x="150" y="312" width="420" height="30" rx="4" fill="#0b1a12" stroke="#7ee787"/>
    <text x="360" y="332" fill="#7ee787" font-size="11" text-anchor="middle">stdio for Claude Desktop &#183; streamable HTTP on 127.0.0.1:8765</text>
  </g>
</svg>
